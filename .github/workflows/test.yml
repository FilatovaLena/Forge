name: Forge checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:hosted
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:hosted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-browser-results
          path: test-results/
          if-no-files-found: ignore
